name: Deploy to AWS Lambda

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: duo-mapping-api

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run basic tests
      run: |
        python -c "import main; print('✅ Main module imports successfully')"
        python -c "import database; print('✅ Database module imports successfully')"
        python -c "import schemas; print('✅ Schemas module imports successfully')"
        python -c "import auth; print('✅ Auth module imports successfully')"
        python -c "import lambda_function; print('✅ Lambda function imports successfully')"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create deployment package (Lambda-compatible)
      run: |
        echo "🚀 Building deployment package in Lambda Python 3.11 image (fixes GLIBC/cryptography)..."
        docker run --rm --entrypoint "" \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          public.ecr.aws/lambda/python:3.11 \
          bash -c "
            pip install --target /tmp/package -r requirements.txt &&
            cp main.py database.py schemas.py auth.py lambda_function.py /tmp/package/ &&
            cd /tmp/package && python -c \"import zipfile,os; os.chdir('/tmp/package'); zf=zipfile.ZipFile('/workspace/deployment-package.zip','w',zipfile.ZIP_DEFLATED); [zf.write(p, p[2:] if p.startswith('./') else p) for r,d,fs in os.walk('.') for p in [os.path.join(r,f) for f in fs]]; zf.close()\"
          "
        SIZE=$(stat -c%s deployment-package.zip)
        SIZE_MB=$((SIZE / 1024 / 1024))
        echo "📦 Package size: ${SIZE_MB}MB"
        if [ $SIZE_MB -gt 50 ]; then
          echo "⚠️ Warning: Package size exceeds 50MB"
        fi
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Deploy to Lambda
      run: |
        echo "🚀 Deploying to AWS Lambda..."
        
        # Update Lambda function
        aws lambda update-function-code \
          --function-name ${{ env.FUNCTION_NAME }} \
          --zip-file fileb://deployment-package.zip
        
        # Wait for update to complete
        echo "⏳ Waiting for deployment to complete..."
        aws lambda wait function-updated \
          --function-name ${{ env.FUNCTION_NAME }}
        
        echo "✅ Deployment completed successfully!"
    
    - name: Test deployment
      run: |
        echo "🧪 Testing deployed API..."
        
        # Get function info
        FUNCTION_INFO=$(aws lambda get-function --function-name ${{ env.FUNCTION_NAME }})
        echo "📊 Function details:"
        echo $FUNCTION_INFO | jq '.Configuration | {FunctionName, LastModified, CodeSize, Runtime}'
        
        # Test API endpoints
        API_URL="https://xwrhlmtfk9.execute-api.us-east-1.amazonaws.com/prod"
        
        echo "🔍 Testing API endpoints..."
        
        # Test root endpoint
        ROOT_RESPONSE=$(curl -s "$API_URL/")
        echo "Root endpoint: $ROOT_RESPONSE"
        
        # Test health endpoint
        HEALTH_RESPONSE=$(curl -s "$API_URL/api/health")
        echo "Health endpoint: $HEALTH_RESPONSE"
        
        # Verify responses contain expected content
        if echo "$ROOT_RESPONSE" | grep -q "Duo Mapping API"; then
          echo "✅ Root endpoint working"
        else
          echo "❌ Root endpoint failed"
          exit 1
        fi
        
        if echo "$HEALTH_RESPONSE" | grep -q "healthy"; then
          echo "✅ Health endpoint working"
        else
          echo "❌ Health endpoint failed"
          exit 1
        fi
        
        echo "🎉 All tests passed! Deployment successful!"
    
    - name: Cleanup
      if: always()
      run: |
        rm -f deployment-package.zip
        rm -rf package
